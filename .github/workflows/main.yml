name: ACEest Continuous Integration Pipeline

on:
  push:
    branches: [ "main", "feature/*" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-lint:
    name: Build & Code Quality Gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Code Linting & Syntax Check
        run: |
          # Stop build if there are Python syntax errors or undefined names
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          # Exit-zero treats all errors as warnings
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

  docker-assembly-and-test:
    name: Docker Assembly & Containerized Testing
    needs: build-and-lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Build Docker Container Image
        run: |
          docker build -t aceest-fitness-app:${{ github.sha }} .
          docker tag aceest-fitness-app:${{ github.sha }} aceest-fitness-app:latest

      - name: Run Pytest Suite inside Container
        run: |
          docker run --rm aceest-fitness-app:latest pytest --verbose
