apiVersion: apps/v1
kind: Deployment
metadata:
  name: aceest-shadow
  namespace: aceest
spec:
  replicas: 1
  selector:
    matchLabels:
      app: aceest
      track: shadow
      role: shadow
  template:
    metadata:
      labels:
        app: aceest
        track: shadow
        role: shadow
    spec:
      containers:
        - name: web
          image: 2025tm93164/aceest-fitness:v2.0
          ports:
            - containerPort: 5000
          env:
            - name: APP_VERSION
              value: "v2.0-shadow"
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
---
apiVersion: v1
kind: Service
metadata:
  name: aceest-shadow
  namespace: aceest
spec:
  selector:
    app: aceest
    role: shadow
  ports:
    - port: 5000
      targetPort: 5000
