apiVersion: apps/v1
kind: Deployment
metadata:
  name: aceest-live
  namespace: aceest
spec:
  replicas: 1
  selector:
    matchLabels:
      app: aceest
      track: shadow
      role: live
  template:
    metadata:
      labels:
        app: aceest
        track: shadow
        role: live
    spec:
      containers:
        - name: web
          image: 2025tm93164/aceest-fitness:v1.0
          ports:
            - containerPort: 5000
          env:
            - name: APP_VERSION
              value: "v1.0-live"
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
---
apiVersion: v1
kind: Service
metadata:
  name: aceest-live
  namespace: aceest
spec:
  selector:
    app: aceest
    role: live
  ports:
    - port: 5000
      targetPort: 5000
