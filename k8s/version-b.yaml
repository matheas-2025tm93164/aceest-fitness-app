apiVersion: apps/v1
kind: Deployment
metadata:
  name: aceest-version-b
  namespace: aceest
spec:
  replicas: 1
  selector:
    matchLabels:
      app: aceest
      track: ab
      version: b
  template:
    metadata:
      labels:
        app: aceest
        track: ab
        version: b
    spec:
      containers:
        - name: web
          image: 2025tm93164/aceest-fitness:v2.0
          ports:
            - containerPort: 5000
          env:
            - name: APP_VERSION
              value: "B-v2.0"
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
---
apiVersion: v1
kind: Service
metadata:
  name: aceest-version-b
  namespace: aceest
spec:
  type: NodePort
  selector:
    app: aceest
    version: b
  ports:
    - port: 80
      targetPort: 5000
