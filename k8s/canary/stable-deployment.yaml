apiVersion: apps/v1
kind: Deployment
metadata:
  name: aceest-stable
  namespace: aceest
spec:
  replicas: 4
  selector:
    matchLabels:
      app: aceest
      track: canary
      version: stable
  template:
    metadata:
      labels:
        app: aceest
        track: canary
        version: stable
    spec:
      containers:
        - name: web
          image: 2025tm93164/aceest-fitness:v1.0
          imagePullPolicy: Always
          ports:
            - containerPort: 5000
          env:
            - name: APP_VERSION
              value: "stable-v1.0"
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 8
            periodSeconds: 5
