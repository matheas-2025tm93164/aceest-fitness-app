apiVersion: apps/v1
kind: Deployment
metadata:
  name: aceest-canary
  namespace: aceest
spec:
  replicas: 1
  selector:
    matchLabels:
      app: aceest
      track: canary
      version: canary
  template:
    metadata:
      labels:
        app: aceest
        track: canary
        version: canary
    spec:
      containers:
        - name: web
          image: 2025tm93164/aceest-fitness:v2.0
          imagePullPolicy: Always
          ports:
            - containerPort: 5000
          env:
            - name: APP_VERSION
              value: "canary-v2.0"
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 8
            periodSeconds: 5
